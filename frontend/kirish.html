<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kirish Sahifasi</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #0f2027);
        background-size: 400% 400%;
        animation: gradientAnimation 15s ease infinite;
      }

      @keyframes gradientAnimation {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .wrapper {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        padding: 40px;
        width: 350px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        animation: glowWrapper 3s infinite alternate;
      }

      @keyframes glowWrapper {
        0% {
          box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        50% {
          box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
        }
        100% {
          box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
      }

      .wrapper h2 {
        color: #ffffff;
        margin-bottom: 30px;
        text-align: center;
        font-size: 22px;
        letter-spacing: 1px;
        text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff;
      }

      .wrapper input {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        transition: 0.3s;
        box-shadow: 0 0 5px #00ffff inset;
        animation: glowInput 3s infinite alternate;
      }

      .wrapper input::placeholder {
        color: #ddd;
      }

      .wrapper input:focus {
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 15px #00ffff inset, 0 0 10px #00ffff;
      }

      @keyframes glowInput {
        0% {
          box-shadow: 0 0 5px #00ffff inset;
        }
        50% {
          box-shadow: 0 0 15px #00ffff inset;
        }
        100% {
          box-shadow: 0 0 5px #00ffff inset;
        }
      }

      .wrapper button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 8px;
        border: none;
        background: #00ffff;
        color: #000;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        animation: glowButton 3s infinite alternate;
      }

      .wrapper button:hover {
        background: #00cccc;
        box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
      }

      @keyframes glowButton {
        0% {
          box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }
        50% {
          box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
        }
        100% {
          box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h2>Parol va telefoningizni kiriting</h2>
      <input type="tel" placeholder="Telefoningizni kiriting" />
      <input type="password" placeholder="Parolingizni kiriting" />
      <button>Kirish</button>
    </div>
  </body>
</html>
